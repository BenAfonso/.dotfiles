# Oil.nvim-style navigation
# Docs: https://yazi-rs.github.io/docs/configuration/keymap/

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = "o"
run = "open"
desc = "Open selected file or directory"

[[mgr.prepend_keymap]]
on = "-"
run = "leave"
desc = "Back to parent directory"

[[mgr.prepend_keymap]]
on = "<Space>"
run = "toggle"
desc = "Toggle selection without moving"

[[mgr.prepend_keymap]]
on = "<Tab>"
run = "tab_switch 1 --relative"
desc = "Switch to next tab"

[[mgr.prepend_keymap]]
on = "<BackTab>"
run = "tab_switch -1 --relative"
desc = "Switch to previous tab"

[[mgr.prepend_keymap]]
on = "i"
run = "spot"
desc = "Spot hovered file"

[[mgr.prepend_keymap]]
on = [ "c", "w" ]
run = "rename --cursor=before_ext"
desc = "Rename hovered file"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = "plugin zoxide"
desc = "Jump to directory via zoxide"

[[mgr.prepend_keymap]]
on = [ "g", "<Space>" ]
run = "cd --interactive"
desc = "Jump to path"

[[mgr.prepend_keymap]]
on = [ "t", "e" ]
run = "tab_create --current"
desc = "Create tab in current directory"

[[mgr.prepend_keymap]]
on = [ "t", "q" ]
run = "close"
desc = "Close current tab"

# Vim-style count motions via relative-motions.yazi
