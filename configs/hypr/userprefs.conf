# Set your personal hyprland configuration here
# See https://wiki.hyprland.org/Configuring for more information

general {
    layout = master
    resize_on_border = false
}

master {
    allow_small_split = true
    special_scale_factor = 0.95
    mfact = 0.55

    new_status = slave
    new_on_top = false
    new_on_active = none
    orientation = left
    smart_resizing = true
    drop_at_cursor = true
}

# // █ █▄░█ █▀█ █░█ ▀█▀
# // █ █░▀█ █▀▀ █▄█ ░█░


#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hyprland.org/Configuring/Variables/#input
input {
    # kb_layout = us
    # follow_mouse = 1
    kb_options = "compose:ralt"
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat 
    # numlock_by_default = true

    # 🔗 See https://wiki.hyprland.org/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = no
    }

}

decoration {
    dim_inactive = false
    dim_modal = false
}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}

binds {
    drag_threshold = 10  # Fire a drag event only after dragging for more than 10px
}

# bindm = ALT, mouse:272, movewindow      # ALT + LMB: Move a window by dragging more than 10px.
bindc = SUPER, mouse:272, togglefloating

